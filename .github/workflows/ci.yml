name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Public contributions run with a read-only token and no repository secrets.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    uses: ./.github/workflows/validate.yml

  audit:
    name: Dependency audit
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-bun
      - run: bun audit --audit-level=moderate

  bundle-size:
    name: Bundle size
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-bun
      - name: Build and check the 10 MB limit
        run: |
          bun build src/index.ts --outdir ./dist --minify --target bun
          du -sh dist/
          size=$(du -sb dist | cut -f1)
          if [ "$size" -gt 10485760 ]; then
            echo "::error::Bundle size exceeds the 10 MB limit"
            exit 1
          fi
