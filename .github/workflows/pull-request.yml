name: Pull request

# The pull request title becomes the squash commit on main and labels the release notes.
on:
  pull_request:
    types: [opened, edited, reopened, synchronize]
  merge_group:

permissions:
  contents: read

concurrency:
  group: pull-request-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  title:
    name: PR title
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-bun

      - name: Check Conventional Commit title
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: bun scripts/release.ts pr-title
