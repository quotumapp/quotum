name: Publish image

# Publishes to the GitHub Container Registry with the workflow token only.
# Release tags (vX.Y.Z) produce X.Y.Z and X.Y, move latest only to the highest stable version, and
# publish a GitHub Release. Pushes to main produce a rolling "main" tag and a release status summary.
on:
  push:
    branches: [main]
    tags: ["v*.*.*"]

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  validate:
    uses: ./.github/workflows/validate.yml

  publish:
    needs: [validate]
    permissions:
      contents: read
      packages: write
    name: Build and push
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      version: ${{ steps.package.outputs.version }}
      previous: ${{ steps.release.outputs.previous }}
      latest: ${{ steps.release.outputs.latest }}
      prerelease: ${{ steps.release.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: ./.github/actions/setup-bun

      - name: Read package version
        id: package
        run: echo "version=$(jq -r .version package.json)" >> "$GITHUB_OUTPUT"

      - name: Release tag must match package.json
        if: github.ref_type == 'tag'
        env:
          TAG: ${{ github.ref_name }}
          VERSION: ${{ steps.package.outputs.version }}
        run: |
          if [ "$TAG" != "v$VERSION" ]; then
            echo "::error::Tag $TAG does not match package.json version $VERSION"
            exit 1
          fi

      - name: Release metadata
        id: release
        if: github.ref_type == 'tag'
        env:
          TAG: ${{ github.ref_name }}
        run: bun scripts/release.ts meta "$TAG"

      - name: Release status
        if: github.ref == 'refs/heads/main'
        run: bun scripts/release.ts unreleased

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - name: Log in to the container registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ steps.release.outputs.latest == 'true' }}
            type=raw,value=main,enable=${{ github.ref == 'refs/heads/main' }}
          labels: |
            org.opencontainers.image.title=Quotum Billing API
            org.opencontainers.image.version=${{ steps.package.outputs.version }}
            org.opencontainers.image.licenses=Apache-2.0

      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BUILD_VERSION=${{ steps.package.outputs.version }}
            BUILD_COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    if: github.ref_type == 'tag'
    needs: [publish]
    permissions:
      contents: write
    name: GitHub Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-bun

      - name: Record image digest
        env:
          VERSION: ${{ needs.publish.outputs.version }}
          DIGEST: ${{ needs.publish.outputs.digest }}
        run: bun scripts/release.ts image-manifest "$VERSION" --digest "$DIGEST" --out-dir release

      # Notes are GitHub's generated pull request list; upgrade details live in each pull request.
      # Assets are attached to a draft before publishing because published releases are immutable.
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          PREVIOUS: ${{ needs.publish.outputs.previous }}
          LATEST: ${{ needs.publish.outputs.latest }}
          PRERELEASE: ${{ needs.publish.outputs.prerelease }}
        run: |
          set -euo pipefail
          if draft=$(gh release view "$TAG" --json isDraft --jq .isDraft 2>/dev/null); then
            if [ "$draft" = "false" ]; then
              echo "::notice::Release $TAG is already published; leaving it unchanged."
              exit 0
            fi
            gh release delete "$TAG" --yes
          fi
          args=(--draft --verify-tag --title "$TAG" --generate-notes)
          if [ -n "$PREVIOUS" ]; then
            args+=(--notes-start-tag "$PREVIOUS")
          fi
          if [ "$PRERELEASE" = "true" ]; then
            args+=(--prerelease)
          fi
          gh release create "$TAG" contracts/v1/openapi.json contracts/v1/errors.json release/image.json "${args[@]}"
          gh release edit "$TAG" --draft=false --latest="$LATEST"
          echo "Published $(gh release view "$TAG" --json url --jq .url)" >> "$GITHUB_STEP_SUMMARY"
