name: Standalone validation
on:
  workflow_call:
permissions:
  contents: read
jobs:
  quality:
    name: Boundaries, types, lint, format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-bun
      - name: Module and table boundaries
        run: bun run check:boundaries
      - name: Type check
        run: bun run typecheck
      - name: Lint
        run: bun run lint
      - name: Format check
        run: bun run format:check

  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-bun
      - name: Unit tests (randomized order)
        run: bun test tests --randomize --seed="$((GITHUB_RUN_ID % 4294967296))"
      - name: Coverage ratchet
        run: bun run test:coverage
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lcov-unit
          path: coverage/lcov.info
          retention-days: 7

  contracts:
    name: OpenAPI contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-bun
      - name: Generated contract is current
        run: bun run openapi:check
      - name: Lint contract
        run: bun run openapi:lint
      - name: Response conformance
        run: bun test tests/http/openapi.test.ts
      - name: Breaking-change report against the base revision
        # Pre-GA policy: the report is for review; generation and conformance above are the gates.
        env:
          OPENAPI_DIFF_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
          # Audited oasdiff build 76d2b54; immutable multi-platform image digest (same as GitLab CI).
          OASDIFF: docker run --rm -v ${{ github.workspace }}:/work -w /work tufin/oasdiff@sha256:a81649b9261295ab05edf9c47a542c5f58e4768fd392e0a0a729db0d714a7ac5
        run: sh ci/openapi-diff.sh
      - name: Upload contract artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: openapi-contract
          path: |
            contracts/v1/
            contract-reports/
          retention-days: 30

  integration-shards:
    name: Integration shard ${{ matrix.shard }}
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
      TESTCONTAINERS_RYUK_DISABLED: "false"
      QUOTUM_TEST_REPORT_DIR: test-reports
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-bun
      - run: bun run test:integration --shard=${{ matrix.shard }}/2 --coverage --coverage-reporter=lcov --coverage-dir=coverage/integration-${{ matrix.shard }} tests/integration
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: junit-integration-${{ matrix.shard }}
          path: test-reports/junit.xml
          retention-days: 30
      - uses: actions/upload-artifact@v7
        with:
          name: lcov-integration-${{ matrix.shard }}
          path: coverage/integration-${{ matrix.shard }}/lcov.info
          if-no-files-found: error

  integration:
    name: Integration tests (Postgres)
    needs: integration-shards
    if: always()
    runs-on: ubuntu-latest
    steps:
      - env:
          RESULT: ${{ needs.integration-shards.result }}
        run: test "$RESULT" = success

  e2e:
    name: End-to-end tests
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
      TESTCONTAINERS_RYUK_DISABLED: "false"
      QUOTUM_TEST_REPORT_DIR: test-reports
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-bun
      - run: bun run test:e2e
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: junit-e2e
          path: test-reports/junit.xml
          retention-days: 30

  merchant:
    name: Merchant integration tests
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
      TESTCONTAINERS_RYUK_DISABLED: "false"
      QUOTUM_TEST_REPORT_DIR: test-reports
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-bun
      - run: bun run test:merchant:integration --coverage --coverage-reporter=lcov --coverage-dir=coverage/merchant
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: junit-merchant
          path: test-reports/junit.xml
          retention-days: 30
      - uses: actions/upload-artifact@v7
        with:
          name: lcov-merchant
          path: coverage/merchant/lcov.info
          if-no-files-found: error

  coverage:
    name: Combined coverage
    needs: [unit, integration, merchant]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-bun
      - uses: actions/download-artifact@v8
        with:
          pattern: lcov-*
          path: coverage/lanes
      - name: Combined coverage floors and ratchet
        run: bun scripts/check-coverage.ts --combined coverage/lanes/lcov-{unit,integration-1,integration-2,merchant}/lcov.info
      - name: Changed executable lines
        if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
        run: bun scripts/check-diff-coverage.ts "$BASE_SHA" coverage/lanes/lcov-{unit,integration-1,integration-2,merchant}/lcov.info

  image:
    name: Container image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Lint Dockerfile
        uses: hadolint/hadolint-action@v3.5.0
        with:
          dockerfile: Dockerfile
          failure-threshold: warning
      - uses: ./.github/actions/setup-bun
      - name: Resolve build version
        id: version
        run: bun scripts/release.ts build-version
      - uses: docker/setup-buildx-action@v4
      - name: Build (no push)
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: false
          load: true
          tags: quotum-api:ci
          build-args: |
            BUILD_VERSION=${{ steps.version.outputs.version }}
            BUILD_COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Operator CLI runs in the image
        run: |
          docker run --rm quotum-api:ci quotum help
          docker run --rm quotum-api:ci quotum version
          docker run --rm quotum-api:ci quotum init > /dev/null
          docker run --rm quotum-api:ci sh -c 'test ! -e node_modules/typescript && test ! -e node_modules/@typescript'
      - name: Install pinned Trivy
        run: sh ci/security/install-scanner.sh trivy
      - name: Scan the built container
        run: |
          mkdir -p security-reports
          trivy image --config ci/security/trivy-image.yaml --image-src docker \
            --format json --output security-reports/trivy-image.json quotum-api:ci
      - name: Upload container findings
        if: ${{ !cancelled() && hashFiles('security-reports/trivy-image.json') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: trivy-ci-image
          path: security-reports/trivy-image.json
          retention-days: 30
      - name: Lint the compose smoke test
        run: shellcheck deploy/compose/smoke.sh
      - name: Headless compose stack smoke test
        env:
          QUOTUM_IMAGE: quotum-api
          QUOTUM_VERSION: ci
        run: deploy/compose/smoke.sh
