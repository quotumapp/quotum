name: Standalone validation
on:
  workflow_call:
permissions:
  contents: read
jobs:
  quality:
    name: Boundaries, types, lint, format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-bun
      - name: Module and table boundaries
        run: bun run check:boundaries
      - name: Type check
        run: bun run typecheck
      - name: Lint
        run: bun run lint
      - name: Format check
        run: bun run format:check

  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-bun
      - name: Unit tests (randomized order)
        run: bun test tests --randomize --seed="$((GITHUB_RUN_ID % 4294967296))"
      - name: Coverage ratchet
        run: bun run test:coverage
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: unit-coverage
          path: coverage/lcov.info
          retention-days: 7

  contracts:
    name: OpenAPI contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-bun
      - name: Generated contract is current
        run: bun run openapi:check
      - name: Lint contract
        run: bun run openapi:lint
      - name: Response conformance
        run: bun test tests/http/openapi.test.ts
      - name: Breaking-change report against the base revision
        # Pre-GA policy: the report is for review; generation and conformance above are the gates.
        env:
          OPENAPI_DIFF_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          # Audited oasdiff build 76d2b54; immutable multi-platform image digest (same as GitLab CI).
          OASDIFF: docker run --rm -v ${{ github.workspace }}:/work -w /work tufin/oasdiff@sha256:a81649b9261295ab05edf9c47a542c5f58e4768fd392e0a0a729db0d714a7ac5
        run: sh ci/openapi-diff.sh
      - name: Upload contract artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: openapi-contract
          path: |
            contracts/v1/
            contract-reports/
          retention-days: 30

  integration:
    name: Integration tests (Postgres)
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
      TESTCONTAINERS_RYUK_DISABLED: "false"
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-bun
      - run: bun run test:integration

  e2e:
    name: End-to-end tests
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
      TESTCONTAINERS_RYUK_DISABLED: "false"
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-bun
      - run: bun run test:e2e

  merchant:
    name: Merchant integration tests
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
      TESTCONTAINERS_RYUK_DISABLED: "false"
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-bun
      - run: bun run test:merchant:integration

  image:
    name: Container image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Lint Dockerfile
        uses: hadolint/hadolint-action@v3.5.0
        with:
          dockerfile: Dockerfile
          failure-threshold: warning
      - name: Read package version
        id: package
        run: echo "version=$(jq -r .version package.json)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4
      - name: Build (no push)
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: false
          tags: quotum-api:ci
          build-args: |
            BUILD_VERSION=${{ steps.package.outputs.version }}
            BUILD_COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
